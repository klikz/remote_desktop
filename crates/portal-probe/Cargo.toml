[package]
name = "portal-probe"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Faqat Linux'da kerak bo'lgan kutubxonalar (Windows build'iga ta'sir qilmaydi).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# Ixtiyoriy: `--features capture` bilan (GStreamer dev paketlari kerak, README ga qarang).
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }

[features]
capture = ["dep:gstreamer", "dep:gstreamer-app"]
