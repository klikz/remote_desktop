[package]
name = "viewer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rdcore = { path = "../rdcore" }
protocol = { path = "../protocol" }
anyhow = "1"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
openh264 = "0.6"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"


[target.'cfg(windows)'.dependencies]
host-windows = { path = "../host-windows" }
tray-icon = { version = "0.19", default-features = false }
